<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="whoami : Sidy Mohamed, développeur full-stack diplômé en Génie Logiciel, basé à Dakar. Actuellement sur CETUD Mobilités et jwt-toolkit.">
  <defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2dd4bf" fill-opacity=".18"/></pattern>
    <style>
      .m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .ln{opacity:0;animation:in .35s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
      .blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
      .lab{font-size:11px;letter-spacing:2.5px;fill:#2dd4bf;font-weight:700}
      .val{font-size:15px;fill:#e8f1f8;font-weight:700}
      .sub{font-size:12px;fill:#7c8ea3}
      .bar{transform-box:fill-box;transform-origin:left;animation:bar 2.4s ease-in-out infinite alternate}
      @keyframes bar{from{transform:scaleX(.25)}to{transform:scaleX(1)}}
    </style>
  </defs>
  <!-- terminal -->
  <rect x=".75" y=".75" width="758.5" height="358.5" rx="14" fill="#0b111b" stroke="#1d2b3c" stroke-width="1.5"/>
  <rect x="2" y="2" width="756" height="356" rx="13" fill="url(#dots)"/>
  <path d="M1 44H759" stroke="#1d2b3c"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f57"/><circle cx="46" cy="22" r="6" fill="#febc2e"/><circle cx="66" cy="22" r="6" fill="#28c840"/>
  <text x="380" y="27" text-anchor="middle" class="m" font-size="13" fill="#7c8ea3">devops@sidy: ~</text>
  <g class="m" font-size="15">
    <text x="28" y="84" class="ln" style="animation-delay:0.2s"><tspan fill="#2dd4bf">❯</tspan><tspan fill="#e8f1f8"> whoami</tspan></text>
    <text x="46" y="110" class="ln" fill="#b4c4d4" style="animation-delay:0.6s">sidy-mohamed <tspan fill="#4d6075">—</tspan> <tspan fill="#5eead4">développeur full-stack</tspan></text>
    <text x="28" y="146" class="ln" style="animation-delay:1.1s"><tspan fill="#2dd4bf">❯</tspan><tspan fill="#e8f1f8"> cat mission.txt</tspan></text>
    <text x="46" y="172" class="ln" fill="#b4c4d4" style="animation-delay:1.5s">Transformer des idées en solutions qui améliorent</text>
    <text x="46" y="194" class="ln" fill="#b4c4d4" style="animation-delay:1.6s">la vie des gens.</text>
    <text x="28" y="230" class="ln" style="animation-delay:2.1s"><tspan fill="#2dd4bf">❯</tspan><tspan fill="#e8f1f8"> ls ./parcours</tspan></text>
    <text x="46" y="256" class="ln" fill="#b4c4d4" style="animation-delay:2.5s"><tspan fill="#5eead4">genie-logiciel/</tspan><tspan fill="#4d6075"> (diplômé)</tspan>  <tspan fill="#5eead4">professeur/</tspan>  <tspan fill="#5eead4">dev-fullstack/</tspan></text>
    <text x="28" y="292" class="ln" style="animation-delay:3.0s"><tspan fill="#2dd4bf">❯</tspan><tspan fill="#e8f1f8"> echo $BASE</tspan></text>
    <text x="46" y="318" class="ln" fill="#b4c4d4" style="animation-delay:3.4s">Dakar, Sénégal <tspan fill="#4d6075">· UTC+0</tspan></text>
  </g>
  <rect x="28" y="334" width="9" height="16" fill="#2dd4bf" class="blink" opacity="0"><set attributeName="opacity" to="1" begin="3.8s"/></rect>

  <!-- now running -->
  <rect x="784.75" y=".75" width="414.5" height="358.5" rx="14" fill="#0b111b" stroke="#1d2b3c" stroke-width="1.5"/>
  <text x="808" y="28" class="m" font-size="12" letter-spacing="2.5" fill="#7c8ea3">NOW.RUNNING</text>
  <circle cx="1172" cy="24" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <path d="M785 44H1199" stroke="#1d2b3c"/>
  <g class="m">
    <g class="ln" style="animation-delay:0.5s"><text x="808" y="80" class="lab">▸ BUILD</text><text x="808" y="102" class="val" style="fill:#e8f1f8">CETUD Mobilités</text><text x="808" y="120" class="sub">backend Spring Boot · mobilité urbaine</text><rect x="1080" y="74" width="96" height="4" rx="2" fill="#2dd4bf" fill-opacity=".15"/><rect x="1080" y="74" width="96" height="4" rx="2" fill="url(#acc)" class="bar" style="animation-delay:0.0s"/></g>
    <g class="ln" style="animation-delay:0.9s"><text x="808" y="160" class="lab">▸ SHIP</text><text x="808" y="182" class="val" style="fill:#e8f1f8">jwt-toolkit</text><text x="808" y="200" class="sub">dépendance publiée sur Maven &amp; GitHub</text><rect x="1080" y="154" width="96" height="4" rx="2" fill="#2dd4bf" fill-opacity=".15"/><rect x="1080" y="154" width="96" height="4" rx="2" fill="url(#acc)" class="bar" style="animation-delay:0.6s"/></g>
    <g class="ln" style="animation-delay:1.3s"><text x="808" y="240" class="lab">▸ LEARN</text><text x="808" y="262" class="val" style="fill:#e8f1f8">Architecture &amp; Design</text><text x="808" y="280" class="sub">architecture · design patterns · CI/CD</text><rect x="1080" y="234" width="96" height="4" rx="2" fill="#2dd4bf" fill-opacity=".15"/><rect x="1080" y="234" width="96" height="4" rx="2" fill="url(#acc)" class="bar" style="animation-delay:1.2s"/></g>
    <g class="ln" style="animation-delay:1.7s"><text x="808" y="320" class="lab">▸ SEEK</text><text x="808" y="342" class="val" style="fill:#34d399">Freelance &amp; collaborations</text></g>
  </g>
</svg>
