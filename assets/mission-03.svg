<svg xmlns="http://www.w3.org/2000/svg" width="590" height="236" viewBox="0 0 590 236" role="img" aria-label="Mission 03 — Portfolio en ligne">
  <defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#2dd4bf" stroke-opacity=".07"/></pattern>
    <clipPath id="c"><rect width="590" height="236" rx="16"/></clipPath>
    
    <style>.m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .sh{animation:sh 2.2s ease-in-out infinite}@keyframes sh{0%,100%{opacity:.3}50%{opacity:.8}}
      .rv{opacity:0;animation:rv .5s ease-out forwards}@keyframes rv{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
      .pop{opacity:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="590" height="236" fill="#0b111b"/>
    <rect x="360" width="230" height="236" fill="url(#g)"/>
    <circle cx="480" cy="110" r="140" fill="url(#glow)"/>
    <g transform="translate(392 36)">
      <rect width="170" height="130" rx="8" fill="#0e1723" stroke="#1d2b3c"/>
      <path d="M0 22H170" stroke="#1d2b3c"/>
      <circle cx="12" cy="11" r="3" fill="#ff5f57"/><circle cx="22" cy="11" r="3" fill="#febc2e"/><circle cx="32" cy="11" r="3" fill="#28c840"/>
      <rect x="44" y="6" width="116" height="10" rx="5" fill="#2dd4bf" fill-opacity=".12"/>
      <rect x="14" y="34" width="70" height="10" rx="3" fill="url(#acc)"/>
      <rect x="14" y="50" width="110" height="6" rx="3" fill="#22d3ee" class="sh" style="animation-delay:.2s"/>
      <rect x="14" y="61" width="90" height="6" rx="3" fill="#22d3ee" class="sh" style="animation-delay:.35s"/>
      <rect x="14" y="78" width="44" height="38" rx="4" fill="#2dd4bf" class="sh" style="animation-delay:.5s"/>
      <rect x="63" y="78" width="44" height="38" rx="4" fill="#22d3ee" class="sh" style="animation-delay:.65s"/>
      <rect x="112" y="78" width="44" height="38" rx="4" fill="#60a5fa" class="sh" style="animation-delay:.8s"/>
      <path d="M0 0l0 14l4 -4l3 7l2 -1l-3 -7l5 0z" fill="#e8f1f8" stroke="#070b12" stroke-width=".8">
        <animateMotion dur="6s" repeatCount="indefinite" path="M150 110 L90 40 L130 95 L40 96 L150 110" keyTimes="0;.3;.55;.8;1" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
      </path>
    </g>
    <g class="m">
      <text x="32" y="44" font-size="11.5" letter-spacing="3" fill="#2dd4bf" font-weight="700">MISSION 03</text>
      <text x="32" y="86" font-size="28" font-weight="800" fill="#e8f1f8">Portfolio</text>
      <text x="32" y="118" font-size="13.5" fill="#b4c4d4">Ma vitrine personnelle :</text><text x="32" y="139" font-size="13.5" fill="#b4c4d4">projets, parcours et contact,</text><text x="32" y="160" font-size="13.5" fill="#b4c4d4">réunis en un seul endroit.</text>
      <g><rect x="32" y="180" width="72" height="28" rx="7" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf" stroke-opacity=".45"/><text x="68.0" y="198.5" text-anchor="middle" font-size="11.5" fill="#5eead4">Projets</text><rect x="112" y="180" width="79" height="28" rx="7" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf" stroke-opacity=".45"/><text x="151.5" y="198.5" text-anchor="middle" font-size="11.5" fill="#5eead4">Parcours</text><rect x="199" y="180" width="72" height="28" rx="7" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf" stroke-opacity=".45"/><text x="235.0" y="198.5" text-anchor="middle" font-size="11.5" fill="#5eead4">Contact</text></g>
      <text x="558" y="214" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#7c8ea3">visiter ↗</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="588.5" height="234.5" rx="16" fill="none" stroke="#1d2b3c" stroke-width="1.5"/>
</svg>
