<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="262" viewBox="0 0 1200 262" role="img" aria-label="Mission 01 — CETUD Mobilités : plateforme de mobilité urbaine pour Dakar, backend Spring Boot">
  <defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2dd4bf" stroke-opacity=".07"/></pattern>
    <clipPath id="c"><rect width="1200" height="262" rx="16"/></clipPath>
    <style>.m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .route{stroke-dasharray:1400;stroke-dashoffset:1400;animation:dr 2.6s .3s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
      .st{opacity:0;animation:in .4s forwards}@keyframes in{to{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="262" fill="#0b111b"/>
    <rect x="640" width="560" height="262" fill="url(#g)"/>
    <circle cx="920" cy="130" r="220" fill="url(#glow)"/>
    <path id="r" d="M660 200 C 720 200, 740 110, 810 110 S 900 190, 960 170 S 1030 60, 1100 70 S 1170 140, 1180 150" fill="none" stroke="#2dd4bf" stroke-opacity=".14" stroke-width="10" stroke-linecap="round"/>
    <path d="M660 200 C 720 200, 740 110, 810 110 S 900 190, 960 170 S 1030 60, 1100 70 S 1170 140, 1180 150" fill="none" stroke="url(#acc)" stroke-width="2.5" stroke-linecap="round" class="route"/>
    <g class="st" style="animation-delay:0.5s"><circle cx="660" cy="200" r="7" fill="#0b111b" stroke="#22d3ee" stroke-width="2.5"/><text x="660" y="230" text-anchor="middle" class="m" font-size="10.5" fill="#7c8ea3" letter-spacing="1.5">app</text></g><g class="st" style="animation-delay:1.0s"><circle cx="810" cy="110" r="7" fill="#0b111b" stroke="#22d3ee" stroke-width="2.5"/><text x="810" y="90" text-anchor="middle" class="m" font-size="10.5" fill="#7c8ea3" letter-spacing="1.5">api</text></g><g class="st" style="animation-delay:1.5s"><circle cx="960" cy="170" r="7" fill="#0b111b" stroke="#22d3ee" stroke-width="2.5"/><text x="960" y="200" text-anchor="middle" class="m" font-size="10.5" fill="#7c8ea3" letter-spacing="1.5">ws</text></g><g class="st" style="animation-delay:2.0s"><circle cx="1100" cy="70" r="7" fill="#0b111b" stroke="#22d3ee" stroke-width="2.5"/><text x="1100" y="50" text-anchor="middle" class="m" font-size="10.5" fill="#7c8ea3" letter-spacing="1.5">db</text></g>
    <circle r="14" fill="#22d3ee" opacity="0"><set attributeName="opacity" to=".25" begin="2.9s"/><animateMotion dur="5s" begin="2.9s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"><mpath href="#r" xlink:href="#r"/></animateMotion></circle>
    <circle r="6" fill="#60a5fa" opacity="0"><set attributeName="opacity" to="1" begin="2.9s"/><animateMotion dur="5s" begin="2.9s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"><mpath href="#r" xlink:href="#r"/></animateMotion></circle>
    <g class="m">
      <text x="40" y="48" font-size="12" letter-spacing="3" fill="#2dd4bf" font-weight="700">MISSION 01</text>
      <text x="40" y="100" font-size="40" font-weight="800" fill="#e8f1f8" letter-spacing="1">CETUD Mobilités</text>
      <text x="40" y="138" font-size="14.5" fill="#b4c4d4">Plateforme de mobilité urbaine pour Dakar, avec le CETUD :</text><text x="40" y="160" font-size="14.5" fill="#b4c4d4">transports publics, taxis/VTC, tourisme et JOJ Dakar 2026.</text><text x="40" y="182" font-size="14.5" fill="#b4c4d4">Je développe le backend : API REST, temps réel, sécurité.</text>
      <g><rect x="40" y="208" width="138" height="28" rx="7" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf" stroke-opacity=".45"/><text x="109.0" y="226.5" text-anchor="middle" font-size="12" fill="#5eead4">Spring Boot 3.5</text><rect x="188" y="208" width="77" height="28" rx="7" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf" stroke-opacity=".45"/><text x="226.5" y="226.5" text-anchor="middle" font-size="12" fill="#5eead4">Java 21</text><rect x="275" y="208" width="100" height="28" rx="7" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf" stroke-opacity=".45"/><text x="325.0" y="226.5" text-anchor="middle" font-size="12" fill="#5eead4">Hexagonale</text><rect x="385" y="208" width="92" height="28" rx="7" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf" stroke-opacity=".45"/><text x="431.0" y="226.5" text-anchor="middle" font-size="12" fill="#5eead4">WebSocket</text><rect x="487" y="208" width="62" height="28" rx="7" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf" stroke-opacity=".45"/><text x="518.0" y="226.5" text-anchor="middle" font-size="12" fill="#5eead4">Redis</text></g>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="260.5" rx="16" fill="none" stroke="#1d2b3c" stroke-width="1.5"/>
</svg>
