name: profile

# Régénère les statistiques et le serpent,
# puis publie le tout sur la branche « output » utilisée par le README.
on:
  schedule:
    - cron: "17 */6 * * *"   # toutes les 6 h
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main, master]
    paths: ["assets/**", ".github/**"]

permissions:
  contents: write

concurrency: profile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0e3b3a,#12665f,#1ea596,#2dd4bf
            dist/snake-light.svg?color_snake=#0891b2&color_dots=#ebedf0,#b8efe8,#6fded0,#2dd4bf,#0f9488

      - name: Statistiques
        env:
          # GH_STATS_TOKEN (token personnel) = contributions et dépôts PRIVÉS inclus.
          # Sans lui, seules les données publiques sont comptées.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/build_profile.py

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
